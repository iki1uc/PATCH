<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMA SUMMARUM · iki1uc · DER EINE MIND</title>
    <meta name="engine" content="iki1uc-master">
    <meta name="layer" content="mind+api+nc+kernel+raum">
    <meta name="runtime" content="directV">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a12;
            color: #d0d9e6;
            font-family: 'Consolas', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            background: radial-gradient(ellipse at 50% 0%, #0a0a20, #000000);
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(10,14,20,0.5);
            border: 1px solid rgba(0,200,255,0.05);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(4px);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid rgba(0,200,255,0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #ffd700, #00ccff, #ff66ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #3d5a70;
            font-size: 11px;
            letter-spacing: 6px;
            margin-top: 4px;
        }

        .grid-3col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin: 12px 0;
        }

        .panel {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,200,255,0.05);
            border-radius: 12px;
            padding: 16px;
        }

        .panel h3 {
            font-size: 11px;
            color: #3d5a70;
            letter-spacing: 4px;
            border-bottom: 1px solid rgba(0,200,255,0.05);
            padding-bottom: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #cube {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1/1;
            margin: 0 auto;
            position: relative;
            background: #060608;
            border: 1px solid rgba(0,200,255,0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        .pixel {
            position: absolute;
            border-radius: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .pixel:hover {
            transform: scale(1.2);
            z-index: 10;
            box-shadow: 0 0 30px rgba(200,180,120,0.15);
        }

        #status {
            padding: 10px 14px;
            font-size: 9px;
            color: #5a7a8a;
            letter-spacing: 2px;
            text-align: center;
            border-top: 1px solid rgba(0,200,255,0.05);
            border-bottom: 1px solid rgba(0,200,255,0.05);
            min-height: 40px;
            line-height: 1.8;
            margin: 8px 0;
        }
        #status .value { color: #8ab4c8; }
        #status .highlight { color: #ffd700; }
        #status .ok { color: #00ff88; }
        #status .warn { color: #ffaa44; }

        #narrativ {
            padding: 12px 14px;
            font-size: 11px;
            color: #8ab4c8;
            line-height: 1.8;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            min-height: 60px;
            border: 1px solid rgba(0,200,255,0.03);
            font-family: 'Consolas', monospace;
            white-space: pre-wrap;
        }

        #log {
            width: 100%;
            height: 80px;
            background: #060608;
            color: #3a5a6a;
            border: 1px solid rgba(0,200,255,0.03);
            padding: 8px 12px;
            overflow: auto;
            font-size: 8px;
            font-family: monospace;
            border-radius: 6px;
            margin: 6px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #log .key { color: #5a8a9a; }
        #log .num { color: #8ab4c8; }
        #log .str { color: #ffd700; }

        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
        }
        .controls button {
            background: rgba(0,0,0,0.3);
            color: #5a7a8a;
            border: 1px solid rgba(0,200,255,0.08);
            padding: 6px 14px;
            font-family: 'Consolas', monospace;
            font-size: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .controls button:hover {
            background: rgba(0,200,255,0.05);
            color: #8ab4c8;
            border-color: rgba(0,200,255,0.2);
        }
        .controls button.primary {
            border-color: rgba(0,200,255,0.15);
            color: #8ab4c8;
        }
        .controls button.primary:hover {
            background: rgba(0,200,255,0.08);
            color: #ffd700;
            border-color: #ffd700;
        }

        .footer {
            margin-top: 12px;
            font-size: 7px;
            color: #1a2a3a;
            letter-spacing: 4px;
            text-align: center;
        }
        .footer .iki1uc { color: #2a3a4a; }

        .pulse-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1a3a4a;
            margin-right: 6px;
            transition: all 0.3s;
        }
        .pulse-indicator.active {
            background: #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.15);
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 900px) {
            .grid-3col { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .container { padding: 12px; }
            .header h1 { font-size: 20px; letter-spacing: 4px; }
            .controls button { font-size: 7px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚡ SUMMA SUMMARUM</h1>
        <div class="sub">iki1uc · DER EINE MIND · ALLES IN ALLEM · NARRATIV</div>
    </div>

    <div id="status">
        <span class="pulse-indicator" id="pulse"></span>
        ⏳ SUMMA SUMMARUM · <span class="highlight">WARTET AUF START</span>
    </div>

    <div id="cube"></div>

    <div class="controls">
        <button class="primary" id="btnStart">▶ START</button>
        <button id="btnReset">⟲ RESET</button>
        <button id="btnNarrativ">📖 NARRATIV</button>
        <button id="btnPulse">🌀 PULSE</button>
        <button id="btnKruemmung">🌌 KRÜMMUNG</button>
        <button id="btnMind">🧠 MIND</button>
    </div>

    <div class="grid-3col">
        <div class="panel">
            <h3>🌀 MIND · STATUS</h3>
            <div id="mindStatus" style="font-size:9px; line-height:1.8; color:#5a7a8a;">⏳ Warte auf Mind...</div>
        </div>
        <div class="panel">
            <h3>📖 NARRATIV</h3>
            <div id="narrativ">⏳ Warte auf Narrativ...</div>
        </div>
        <div class="panel">
            <h3>📊 ACHSEN</h3>
            <div id="axisStatus" style="font-size:9px; line-height:1.8; color:#5a7a8a;">⏳ Warte auf Achsen...</div>
        </div>
    </div>

    <div id="log">⏳ SUMMA SUMMARUM · BEREIT</div>

    <div class="footer">SOLAR · ALUF · EVOTAAL · NIRWANA · SEN·SA·TION · <span class="iki1uc">iki1uc</span></div>
</div>

<script type="importmap">
{
    "imports": {
        "./api/": "./api/",
        "./rolle/": "./rolle/",
        "./kernel/": "./kernel/"
    }
}
</script>

<script type="module">
// ─── SUMMA SUMMARUM · MASTER ENGINE ──────────────────────────

// ─── MIND.ALGORITHM (eingebaut, da mindd.js nicht immer verfügbar) ──
const MIND = {
    time: 0, pulse: 0.5, syn: 0.5, freund: 0, quandt: 1.0, earn: 0,
    markt: 0, industrie: 0, boerse: 0, leben: 0, arbeit: 0, fun: 0, dirty: 0,
    axis: { 3: { value: 3, label: "UR", live: 0 }, 9: { value: 9, label: "KERN", live: 0 }, 27: { value: 27, label: "ORBIT", live: 0 }, 81: { value: 81, label: "RAUM", live: 0 }, 243: { value: 243, label: "KANAL", live: 0 }, 756: { value: 756, label: "LEBEN", live: 0 } },

    pump() {
        this.time += 0.025;
        this.pulse = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(this.time * 0.9));
        this.syn = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(this.time * 0.7));
        this.freund = this.syn * Math.sin(this.time * 0.7 + Math.PI/2) * this.quandt;
        this.earn += (this.syn * 0.012 + this.pulse * 0.006) * this.quandt;
        this.markt = this.earn * 0.5 + this.syn * 0.3;
        this.industrie = this.markt * 0.6 + this.pulse * 0.2;
        this.boerse = this.industrie * 0.7 + this.freund * 0.1;
        this.leben = this.syn * 0.4 + this.pulse * 0.3 + this.freund * 0.2;
        this.arbeit = this.leben * 0.5 + this.earn * 0.3;
        this.fun = this.leben * 0.3 + this.freund * 0.4 + this.pulse * 0.2;
        this.dirty = this.arbeit * 0.3 + this.fun * 0.3 + this.boerse * 0.2;
        this.updateAxis();
        return this;
    },

    updateAxis() {
        const keys = Object.keys(this.axis);
        keys.forEach((key, idx) => {
            const a = this.axis[key];
            const base = this.syn * 0.3 + this.pulse * 0.2 + this.freund * 0.1 + this.quandt * 0.1 + this.markt * 0.05 + this.leben * 0.05;
            const weight = (idx + 1) / 6;
            a.live = Math.min(1, Math.max(0, base * (1 + weight * 0.5)));
            if (key === "756") a.live = Math.min(1, a.live * 1.3 + 0.1);
        });
    },

    status() {
        return { time: this.time, pulse: this.pulse, syn: this.syn, freund: this.freund,
                 quandt: this.quandt, earn: this.earn, markt: this.markt, industrie: this.industrie,
                 boerse: this.boerse, leben: this.leben, arbeit: this.arbeit, fun: this.fun,
                 dirty: this.dirty, axis: this.axis };
    },

    narrativ() {
        const s = this.status();
        let text = "";
        if (s.leben > 0.7) text += "🌱 Das Leben blüht. ";
        else if (s.leben > 0.4) text += "🌿 Das Leben wächst. ";
        else text += "🌫️ Das Leben ruht. ";
        if (s.arbeit > 0.7) text += "⚡ Die Arbeit fließt. ";
        else if (s.arbeit > 0.4) text += "🔄 Die Arbeit bewegt sich. ";
        else text += "⏸️ Die Arbeit wartet. ";
        if (s.markt > 0.7) text += "📈 Der Markt boomt. ";
        else if (s.markt > 0.4) text += "📊 Der Markt pulsiert. ";
        else text += "📉 Der Markt ruht. ";
        if (s.fun > 0.7) text += "🎉 Der Fun ist grenzenlos. ";
        else if (s.fun > 0.4) text += "😊 Der Fun ist spürbar. ";
        else text += "🧘 Der Fun ist still. ";
        if (s.dirty > 0.7) text += "🔥 Die Dirty-Seite ist wach. ";
        else if (s.dirty > 0.4) text += "🌊 Die Dirty-Seite fließt. ";
        else text += "💧 Die Dirty-Seite ruht. ";
        text += `\n🌀 SYN: ${s.syn.toFixed(2)} · EARN: ${s.earn.toFixed(2)} · MARKT: ${s.markt.toFixed(2)}`;
        text += `\n🧠 FREUND: ${s.freund.toFixed(2)} · LEBEN: ${s.leben.toFixed(2)} · ARBEIT: ${s.arbeit.toFixed(2)}`;
        return text;
    }
};

// ─── DOM ──────────────────────────────────────────────────────
const cube = document.getElementById('cube');
const status = document.getElementById('status');
const log = document.getElementById('log');
const pulse = document.getElementById('pulse');
const mindStatus = document.getElementById('mindStatus');
const narrativ = document.getElementById('narrativ');
const axisStatus = document.getElementById('axisStatus');

const btnStart = document.getElementById('btnStart');
const btnReset = document.getElementById('btnReset');
const btnNarrativ = document.getElementById('btnNarrativ');
const btnPulse = document.getElementById('btnPulse');
const btnKruemmung = document.getElementById('btnKruemmung');
const btnMind = document.getElementById('btnMind');

// ─── STATE ──────────────────────────────────────────────────
let state = {
    running: false,
    values: [3, 9, 27, 81, 243, 729, 2187, 6561, 19683],
    axis3: [],
    axis9: [],
    axis27: [],
    axis81: [],
    life360: [],
    mind: null,
    narrativActive: false,
    pulseActive: false,
    kruemmungActive: false,
    pixels: []
};

// ─── CUBE · 9×9 ─────────────────────────────────────────────
function buildCube() {
    cube.innerHTML = '';
    state.pixels = [];
    const size = cube.clientWidth || 480;
    const cellSize = (size - 4) / 9;

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            pixel.style.width = cellSize + 'px';
            pixel.style.height = cellSize + 'px';
            pixel.style.left = (c * (cellSize + 2) + 2) + 'px';
            pixel.style.top = (r * (cellSize + 2) + 2) + 'px';

            const v = (r * 9 + c + 1);
            pixel.dataset.value = v;
            pixel.dataset.row = r;
            pixel.dataset.col = c;

            pixel.addEventListener('click', () => {
                const val = parseInt(pixel.dataset.value);
                log.textContent = `🎯 PIXEL ${val} · ACHSE: ${val % 81 === 0 ? '81-RAUM' : val % 27 === 0 ? '27-ORBIT' : val % 9 === 0 ? '9-KERN' : '3-UR'}`;
            });

            cube.appendChild(pixel);
            state.pixels.push(pixel);
        }
    }
}

// ─── RENDER CUBE ────────────────────────────────────────────
function renderCube(values) {
    const pixels = state.pixels;
    const sorted = [...values].sort((a, b) => a - b);
    const max = sorted.length > 0 ? sorted[sorted.length - 1] : 1;

    pixels.forEach(pixel => {
        const val = parseInt(pixel.dataset.value);
        const has = values.includes(val);
        const intensity = has ? (val / max) : 0;

        if (has) {
            const r = Math.floor(40 + intensity * 180);
            const g = Math.floor(30 + intensity * 160);
            const b = Math.floor(20 + intensity * 120);
            pixel.style.background = `rgb(${r}, ${g}, ${b})`;
            pixel.style.opacity = '1';
            pixel.style.border = `1px solid rgba(0,200,255,${0.05 + intensity * 0.2})`;
            pixel.style.boxShadow = `0 0 ${intensity * 20}px rgba(0,200,255,${intensity * 0.05})`;
        } else {
            pixel.style.background = '#060608';
            pixel.style.opacity = '0.2';
            pixel.style.border = '1px solid #0a0a0a';
            pixel.style.boxShadow = 'none';
        }
    });
}

// ─── RUN ────────────────────────────────────────────────────
function run() {
    const values = state.values;

    // Mind pumpen
    const mind = MIND.pump().status();
    state.mind = mind;

    // Achsen aus Mind
    const axisValues = [];
    Object.keys(mind.axis).forEach(key => {
        if (mind.axis[key].live > 0.3) {
            axisValues.push(mind.axis[key].value);
        }
    });
    if (axisValues.length === 0) axisValues.push(3, 9, 27, 81);

    state.axis3 = axisValues;
    state.axis9 = axisValues.map(v => ({ value: v, degree: (v * 40) % 360 }));

    renderCube(axisValues);

    // Status
    status.innerHTML = `
        <span class="pulse-indicator active"></span>
        SUMMA SUMMARUM · <span class="highlight">LÄUFT</span> ·
        WERTE: <span class="value">${axisValues.length}</span> ·
        PULSE: <span class="value">${mind.pulse.toFixed(2)}</span> ·
        SYN: <span class="value">${mind.syn.toFixed(2)}</span> ·
        MARKT: <span class="value">${mind.markt.toFixed(2)}</span> ·
        LEBEN: <span class="value">${mind.leben.toFixed(2)}</span>
        ${state.kruemmungActive ? ' · 🌌 KRÜMMUNG' : ''}
        ${state.pulseActive ? ' · 🌀 PULSE' : ''}
        ${state.narrativActive ? ' · 📖 NARRATIV' : ''}
    `;

    // Mind Status
    mindStatus.innerHTML = `
        <span class="ok">●</span> PULSE: ${mind.pulse.toFixed(2)}<br>
        <span class="ok">●</span> SYN: ${mind.syn.toFixed(2)}<br>
        <span class="ok">●</span> FREUND: ${mind.freund.toFixed(2)}<br>
        <span class="ok">●</span> EARN: ${mind.earn.toFixed(2)}<br>
        <span class="ok">●</span> MARKT: ${mind.markt.toFixed(2)}<br>
        <span class="ok">●</span> LEBEN: ${mind.leben.toFixed(2)}<br>
        <span class="ok">●</span> ARBEIT: ${mind.arbeit.toFixed(2)}<br>
        <span class="ok">●</span> FUN: ${mind.fun.toFixed(2)}<br>
        <span class="ok">●</span> DIRTY: ${mind.dirty.toFixed(2)}
    `;

    // Achsen Status
    axisStatus.innerHTML = Object.keys(mind.axis).map(key => {
        const a = mind.axis[key];
        const bar = '█'.repeat(Math.floor(a.live * 20)) + '░'.repeat(20 - Math.floor(a.live * 20));
        return `<span class="${a.live > 0.5 ? 'ok' : 'warn'}">${a.label} (${key})</span> ${a.live.toFixed(2)} [${bar}]`;
    }).join('<br>');

    // Narrativ
    if (state.narrativActive) {
        narrativ.textContent = mind.narrativ();
    } else {
        narrativ.textContent = '📖 Narrativ inaktiv · Klicke auf NARRATIV';
    }

    pulse.classList.add('active');
    state.running = true;
    log.textContent = `✅ SUMMA SUMMARUM · RUN · ${new Date().toLocaleTimeString()}`;
}

// ─── RESET ──────────────────────────────────────────────────
function reset() {
    state.running = false;
    state.values = [3, 9, 27, 81, 243, 729, 2187, 6561, 19683];
    state.mind = null;
    state.narrativActive = false;
    state.pulseActive = false;
    state.kruemmungActive = false;
    pulse.classList.remove('active');
    renderCube(state.values);
    status.innerHTML = '⟲ RESET · <span class="highlight">SUMMA SUMMARUM BEREIT</span>';
    mindStatus.innerHTML = '⏳ Warte auf Start...';
    axisStatus.innerHTML = '⏳ Warte auf Achsen...';
    narrativ.textContent = '⏳ Warte auf Narrativ...';
    log.textContent = '⟲ Reset durchgeführt.';
}

// ─── TOGGLES ─────────────────────────────────────────────────
function toggleNarrativ() {
    state.narrativActive = !state.narrativActive;
    if (state.running) run();
    else {
        narrativ.textContent = state.narrativActive ? '📖 Narrativ aktiviert · Starte RUN' : '📖 Narrativ inaktiv';
    }
}

function togglePulse() {
    state.pulseActive = !state.pulseActive;
    if (state.running) run();
}

function toggleKruemmung() {
    state.kruemmungActive = !state.kruemmungActive;
    if (state.running) run();
}

function toggleMind() {
    if (state.running) {
        run();
    } else {
        const mind = MIND.pump().status();
        mindStatus.innerHTML = `🧠 MIND geladen · PULSE: ${mind.pulse.toFixed(2)} · SYN: ${mind.syn.toFixed(2)}`;
        log.textContent = '🧠 MIND geladen · Starte RUN für volle Aktivierung';
    }
}

// ─── INIT ──────────────────────────────────────────────────
buildCube();
renderCube(state.values);

// ─── EVENTS ──────────────────────────────────────────────────
btnStart.addEventListener('click', run);
btnReset.addEventListener('click', reset);
btnNarrativ.addEventListener('click', toggleNarrativ);
btnPulse.addEventListener('click', togglePulse);
btnKruemmung.addEventListener('click', toggleKruemmung);
btnMind.addEventListener('click', toggleMind);

// ─── AUTO‑START ─────────────────────────────────────────────
setTimeout(() => {
    run();
    state.narrativActive = true;
    state.pulseActive = true;
    state.kruemmungActive = true;
    setTimeout(() => run(), 100);
}, 400);

console.log('⚡ SUMMA SUMMARUM · iki1uc · DER EINE MIND geladen');
</script>
</body>
</html>
